# cargo-deny configuration for the knot workspace.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Every entry below is a finding with NO reachable fix at the pinned versions.
# Each records the real dependency path (verified with `cargo tree -i <crate>`)
# and the single upstream event that would let us drop the ignore. Re-check on
# each dependency refresh; delete an entry the moment its fix lands.
ignore = [
    # rsa 0.9 has a timing sidechannel (Marvin Attack). rsa is a DIRECT
    # dependency of openidconnect — NOT via oauth2, which declares no rsa at
    # all — and openidconnect 4.0.1 (the current latest) requires `rsa ^0.9.2`
    # non-optionally. The constant-time rewrite exists only in the 0.10.0-rc
    # line, which no caret range can reach.
    # Reachability: RS256 JWT signature VERIFICATION only; knot never decrypts.
    # Mitigation: the OIDC issuer is deployed inside the same trust boundary as
    # the server, bounding network-observable timing.
    # Tracked: https://github.com/RustCrypto/RSA/issues/626
    # Drop when: rsa 0.10.0 final ships AND openidconnect widens to ^0.10.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack; direct dep of openidconnect 4.0.1; verification-only path; no stable fix published" },

    # crypto-bigint < 0.7.6 has secret-dependent branches in operations meant
    # to be constant-time. Path: openidconnect 4.0.1 (the current latest) ->
    # p256 0.13 / p384 0.13 -> ecdsa 0.16 / elliptic-curve 0.13 ->
    # crypto-bigint ^0.5. The fix exists only in 0.7.6; no 0.5.x patch is
    # published and elliptic-curve 0.13 cannot reach 0.7.
    # Reachability: ES256/ES384 ID-token signature VERIFICATION only. knot
    # authenticates to the provider with a client secret and holds no EC
    # private key, so the affected arithmetic only ever sees public values
    # (public keys, signatures, hashes); a timing leak reveals nothing secret.
    # Drop when: openidconnect moves to elliptic-curve 0.14 (crypto-bigint
    # >= 0.7.6).
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint timing branches; via openidconnect 4.0.1 -> p256/p384 0.13; verification-only on public values; fix only in 0.7.6" },

    # quick-xml < 0.41 parses S3 API responses (two DoS advisories: quadratic
    # duplicate-attribute scanning and unbounded namespace allocation).
    # Path: rust-s3 0.37.2 -> quick-xml ^0.38, and aws-creds 0.39.1 -> ^0.38.
    # Both are already at their latest release, so 0.41 is unreachable without
    # an upstream bump. Reachability: only parses responses from the configured
    # S3 endpoint, which is operator-supplied infrastructure, not user input.
    # Drop when: rust-s3 and aws-creds widen to quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic attribute scan; capped at ^0.38 by rust-s3/aws-creds; parses only operator-configured S3 endpoint responses" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml namespace-allocation DoS; capped at ^0.38 by rust-s3/aws-creds; parses only operator-configured S3 endpoint responses" },

    # smallstr is unmaintained with no successor. Path: yrs -> smallstr ^0.3,
    # unchanged from yrs 0.21 through the current 0.27.3, so bumping yrs does
    # not help. Unmaintained-only: no known vulnerability.
    # Drop when: yrs replaces or vendors smallstr.
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained; pinned at ^0.3 by yrs through 0.27.3; no vulnerability, no successor crate" },

    # unsafe-libyaml is unmaintained (repository archived; it is a c2rust
    # translation of libyaml). Path: knot-config -> figment 0.10.19 (feature
    # "yaml") -> serde_yaml 0.9.34 (itself deprecated) -> unsafe-libyaml
    # 0.2.11. figment 0.10.19 is the current latest and its Yaml provider is
    # built on serde_yaml, so no bump reaches a safe-Rust parser.
    # Unmaintained-only: no known vulnerability. Reachability: parses only the
    # operator-supplied config file named by KNOT_CONFIG, never user input.
    # Drop when: figment moves its Yaml provider off serde_yaml, or knot drops
    # YAML config files.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; via figment's Yaml provider (serde_yaml); parses only the operator's KNOT_CONFIG file; no vulnerability" },

    # zip < 9 extracts archives unsafely: ZipArchive::extract and
    # ZipStreamReader::extract keep SUID/SGID bits, create symlinks whose
    # targets lie outside the destination, and apply permissions through them.
    # zip is a DIRECT dependency of knot-server (workspace export/import),
    # pinned at ^8; the fixes exist only in the 9.0 major, which Renovate raises
    # from the Dependency Dashboard rather than on its own.
    # Reachability: none. Import opens the upload with ZipArchive::new over an
    # in-memory buffer and reads entries by name; export only writes through
    # ZipWriter. Nothing calls extract() or writes to the filesystem.
    # Drop when: knot-server moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() keeps SUID/SGID bits; fix only in zip 9; knot reads archives in memory and never extracts" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() symlinks escape the destination; fix only in zip 9; knot reads archives in memory and never extracts" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() chmods through symlinks; fix only in zip 9; knot reads archives in memory and never extracts" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-roots; permissive, LF-approved
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# ring uses a custom not-quite-OpenSSL license; accept as a known exception.
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # path = "../..." workspace internals
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
