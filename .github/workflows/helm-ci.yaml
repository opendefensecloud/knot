name: Helm chart CI

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yaml"
  push:
    branches: [main, master]
    paths:
      - "deploy/helm/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: ct lint
        # --config is required: chart-testing-action sets CT_CONFIG_DIR to the
        # tool's own install dir, so ct never discovers the repo-root ct.yaml
        # and silently ignores check-version-increment.
        run: ct lint --config ct.yaml --target-branch main --chart-dirs deploy/helm

      - name: Chart render checks
        # Renders the chart with several value sets and asserts the ConfigMap:
        # no number in exponent notation (a large value without `| int64`
        # renders as 1.073741824e+10, which the server refuses at startup),
        # trustedProxies as a list or a string, and the schema refusing values
        # the server would refuse.
        run: deploy/helm/check-render.sh

      # NOTE: `ct install` (deploy-to-kind smoke test) is intentionally omitted:
      # the chart's default image is not published yet, so an install hits
      # ImagePullBackOff. Restore it once the release pipeline publishes an
      # image (build + kind-load the image, deploy a throwaway Postgres, then
      # `ct install` with migrations + probes enabled). The e2e workflow already
      # exercises the binary against Postgres in the meantime.
