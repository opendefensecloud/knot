<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="knot">
  <title>knot</title>
  <!--
    The trefoil: the simplest knot that cannot be untied. Traced from
    x = sin t + 2 sin 2t, y = cos t - 2 cos 2t, rotated a half turn so two
    lobes sit at the base.

    The over/under weave is cut by the dash pattern, not by separate strands.
    The curve's three under-crossings are exactly one third of the way apart,
    so with pathLength normalised to 300 one weave period is exactly 100 units:
    each dash draws a strand, each gap is where it passes beneath another.
    Changing the path means recomputing dasharray/dashoffset, or the gaps
    drift off the crossings.
  -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>
