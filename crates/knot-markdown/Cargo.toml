[package]
name = "knot-markdown"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
knot-crdt = { path = "../knot-crdt" }
yrs.workspace = true
thiserror.workspace = true
pulldown-cmark.workspace = true
uuid.workspace = true
chrono.workspace = true

[features]
# The frozen pre-fix serializer, importer and task extractor, and the
# compatibility classifiers (`knot_markdown::legacy`). Tests only.
legacy-compat = []

[dev-dependencies]
# Enables `legacy-compat` for this crate's own tests.
knot-markdown = { path = ".", features = ["legacy-compat"] }
