# Default values for knot.
# Assumes EXTERNAL Postgres + OIDC. The dev-compose stack in deploy/compose
# is for local development only.

image:
  # Image published by this repo's release workflow (release.yaml) on a v* tag, with the
  # leading "v" stripped so the pushed tag matches .Chart.AppVersion.
  # MUST match `ghcr.io/${{ github.repository }}` in release.yaml. This previously
  # pointed at ghcr.io/christianhuening/knot — a real, populated registry from a
  # different lineage — so a default install silently ran an unrelated image
  # instead of failing.
  repository: ghcr.io/opendefensecloud/knot
  tag: ""              # defaults to .Chart.AppVersion at template-render time
  pullPolicy: IfNotPresent
  pullSecrets: []

# Horizontally scalable: document and board collaboration fans out across pods
# via Postgres LISTEN/NOTIFY, so replicaCount can be raised. (Login throttling is
# still per-process, so brute-force protection weakens as replicas increase.)
replicaCount: 1

# Required: Postgres connection URL.
database:
  url: ""
  existingSecretName: ""
  existingSecretKey: "url"
  # Pool size per replica. Budget against Postgres max_connections:
  # roughly replicaCount * (maxConnections + 2).
  maxConnections: 16

# Required: session signing key (32 bytes).
session:
  key: ""
  existingSecretName: ""
  existingSecretKey: "key"

# Optional OIDC configuration.
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""              # https://<host>/auth/oidc/callback
  existingSecretName: ""
  autoProvision: "off"          # off | always | domain | group
  allowedDomains: ""
  roleFromGroups: ""
  # Comma-separated regex patterns for extra `aud` values to trust besides
  # clientId, each matched against the whole audience (a bare id matches only
  # itself; `\d{18}` matches any 18-digit id). Needed for IdPs that add
  # audiences — e.g. Zitadel adds the project id (and sometimes more). For
  # Zitadel use '^\d{18}$' rather than listing each id.
  extraAudiences: ""

baseUrl: ""

logLevel: info
logFormat: json

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

metrics:
  enabled: true
  port: 9090

networkPolicy:
  enabled: false
  # Selectors describing who is allowed to reach the http port.
  # Empty list = no http ingress (useful with a sidecar-only deployment).
  # The chart does NOT default to allowing everything — explicit is safer.
  ingressFrom:
    - namespaceSelector: {}     # any namespace
      podSelector: {}            # any pod
  # Selectors for who can scrape the metrics port. Default: prometheus pod.
  metricsIngressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  namespace: ""
  labels: {}
  metricRelabelings: []
  relabelings: []

alerting:
  enabled: false
  pageSeverity: critical
  ticketSeverity: warning
  errorBudgetTarget: 0.995
  latencyP95Target: 0.25

tracing:
  enabled: false
  otlpEndpoint: ""     # e.g. http://otel-collector.observability.svc.cluster.local:4317

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: knot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Blob storage backend.
#   postgres — bytea in the same DB as everything else (10 MB hard cap)
#   s3       — S3-compatible (AWS S3, MinIO, R2). Requires building knot-server
#              with --features s3 and supplying AWS creds via existingSecretName.
blob:
  backend: postgres
  s3:
    bucket: ""
    endpoint: ""        # e.g. http://minio.svc.cluster.local:9000
    region: us-east-1
    prefix: ""
    # AWS creds via existingSecret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
    existingSecretName: ""

# Deleted documents go to the archive, where editors can restore them, and
# are permanently deleted (with their attachments, including S3 objects)
# this many days later by an hourly job. Owners can delete permanently
# sooner from the archive page. Database backups keep purged content for as
# long as you keep the backups.
archive:
  retentionDays: 30

# Page history is built in the background on every replica. workers bounds
# concurrent replays per replica; cpuShare is the share of one CPU core each
# worker may use on average (it sleeps after each page in proportion to its
# compute time): unpaced, one worker can use a whole core, the default
# resources.limits.cpu, which it shares with the web server; raise either
# only with CPU headroom; workers: 0 turns the builder off on that replica
# (an incident switch; history then waits). replayMaxBytes caps the input of
# every replay, builds and word counts alike (the page's state plus the edits
# and snapshots it reads); a replay holds up to about 40 times its input in
# memory (measured), so peak builder memory is about workers × 40 ×
# replayMaxBytes (160 MiB at the defaults),
# which must fit resources.limits.memory next to the web server. A page whose
# input exceeds the cap gets no further history until the cap is raised.
history:
  workers: 1
  replayMaxBytes: 4194304
  cpuShare: 0.5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

migrations:
  enabled: true
  backoffLimit: 3

probes:
  enabled: true

# Graceful shutdown. On SIGTERM the server stops accepting connections, sends
# a 1001 Close to live collab WebSockets, and drains in-flight HTTP. preStop
# sleeps first so the pod leaves Service endpoints before draining begins
# (kube-proxy stops routing new traffic). Uses the native `sleep` lifecycle
# handler — no shell, so it works on the scratch image. After the HTTP drain
# each page's writer gets up to 10 s to save the edits it still holds (during
# a database outage it keeps retrying them).
# Budget: preStop (preStopSleepSeconds) + up to 30 s of HTTP drain + up to
# 10 s of page-writer drain + 5 s of slack = 50 s. A shorter grace period can
# lose buffered edits on a shutdown during a database outage.
terminationGracePeriodSeconds: 50
preStopSleepSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
