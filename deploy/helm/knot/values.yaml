# Default values for knot.
# Assumes EXTERNAL Postgres + OIDC. The dev-compose stack in deploy/compose
# is for local development only.

image:
  # Image published by this repo's release workflow (release.yaml) on a v* tag, with the
  # leading "v" stripped so the pushed tag matches .Chart.AppVersion.
  # MUST match `ghcr.io/${{ github.repository }}` in release.yaml. This previously
  # pointed at ghcr.io/christianhuening/knot — a real, populated registry from a
  # different lineage — so a default install silently ran an unrelated image
  # instead of failing.
  repository: ghcr.io/opendefensecloud/knot
  tag: ""              # defaults to .Chart.AppVersion at template-render time
  pullPolicy: IfNotPresent
  pullSecrets: []

# Horizontally scalable: document and board collaboration fans out across pods
# via Postgres LISTEN/NOTIFY, so replicaCount can be raised. Login throttling and
# the rate limits (rateLimit below) are per-process: a user or client spread over
# N replicas gets up to N times each limit, so brute-force protection weakens as
# replicas increase; divide the rate limits with rateLimit.scale if that matters
# (the scale doesn't change the login failure throttle). Quotas are counted in
# Postgres and hold across replicas.
replicaCount: 1

# Required: Postgres connection URL.
database:
  url: ""
  existingSecretName: ""
  existingSecretKey: "url"
  # Pool size per replica. Budget against Postgres max_connections:
  # roughly replicaCount * (maxConnections + 2).
  maxConnections: 16

# Required: session signing key (32 bytes).
session:
  key: ""
  existingSecretName: ""
  existingSecretKey: "key"

# Optional OIDC configuration.
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""              # https://<host>/auth/oidc/callback
  existingSecretName: ""
  autoProvision: "off"          # off | always | domain | group
  allowedDomains: ""
  roleFromGroups: ""
  # Comma-separated regex patterns for extra `aud` values to trust besides
  # clientId, each matched against the whole audience (a bare id matches only
  # itself; `\d{18}` matches any 18-digit id). Needed for IdPs that add
  # audiences — e.g. Zitadel adds the project id (and sometimes more). For
  # Zitadel use '^\d{18}$' rather than listing each id.
  extraAudiences: ""

baseUrl: ""

logLevel: info
logFormat: json

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

metrics:
  enabled: true
  port: 9090

networkPolicy:
  enabled: false
  # Selectors describing who is allowed to reach the http port.
  # Empty list = no http ingress (useful with a sidecar-only deployment).
  # The chart does NOT default to allowing everything — explicit is safer.
  ingressFrom:
    - namespaceSelector: {}     # any namespace
      podSelector: {}            # any pod
  # Selectors for who can scrape the metrics port. Default: prometheus pod.
  metricsIngressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  namespace: ""
  labels: {}
  metricRelabelings: []
  relabelings: []

alerting:
  enabled: false
  pageSeverity: critical
  ticketSeverity: warning
  errorBudgetTarget: 0.995
  latencyP95Target: 0.25
  # KnotRateLimitedSustained (ticket severity) fires when one bucket refuses
  # more than this many requests per second (all replicas together, 15 min
  # average) for 30 minutes. Normal use doesn't reach a limit, so a sustained
  # rate means a script or a misbehaving client.
  rateLimitedPerSecond: 1

tracing:
  enabled: false
  otlpEndpoint: ""     # e.g. http://otel-collector.observability.svc.cluster.local:4317

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: knot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Blob storage backend.
#   postgres — bytea in the same DB as everything else (10 MB hard cap)
#   s3       — S3-compatible (AWS S3, MinIO, R2). Requires building knot-server
#              with --features s3 and supplying AWS creds via existingSecretName.
blob:
  backend: postgres
  s3:
    bucket: ""
    endpoint: ""        # e.g. http://minio.svc.cluster.local:9000
    region: us-east-1
    prefix: ""
    # AWS creds via existingSecret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
    existingSecretName: ""

# Deleted documents go to the archive, where editors can restore them, and
# are permanently deleted (with their attachments, including S3 objects)
# this many days later by an hourly job. Owners can delete permanently
# sooner from the archive page. Database backups keep purged content for as
# long as you keep the backups.
archive:
  retentionDays: 30

# Page history is built in the background on every replica. workers bounds
# concurrent replays per replica; cpuShare is the share of one CPU core each
# worker may use on average (it sleeps after each page in proportion to its
# compute time): unpaced, one worker can use a whole core, the default
# resources.limits.cpu, which it shares with the web server; raise either
# only with CPU headroom; workers: 0 turns the builder off on that replica
# (an incident switch; history then waits). replayMaxBytes caps the input of
# every replay, builds and word counts alike (the page's state plus the edits
# and snapshots it reads); a replay holds up to about 40 times its input in
# memory (measured), so peak builder memory is about workers × 40 ×
# replayMaxBytes (160 MiB at the defaults),
# which must fit resources.limits.memory next to the web server. A page whose
# input exceeds the cap gets no further history until the cap is raised.
history:
  workers: 1
  replayMaxBytes: 4194304
  cpuShare: 0.5

# Rate limits (README "Rate limits and quotas"). Every limit is an in-memory
# token bucket per user (sign-in and public share links: per client IP), per
# replica. The per-bucket numbers are built in and sized well above normal use;
# scale multiplies all of them (above 0, at most 100; 0.5 halves them, 2
# doubles them). enabled: false turns off every HTTP and collab WebSocket rate
# limit (not quotas, not the import caps). collabMaxSockets is how many collab
# WebSockets one user may hold open on one replica (at least 1; every open page
# or board tab holds one). Set a fractional scale here or with
# --set-json rateLimit.scale=0.5: --set passes "0.5" as a string, which the
# schema refuses.
rateLimit:
  enabled: true
  scale: 1
  collabMaxSockets: 64

# Reverse proxies whose X-Forwarded-For knot believes: a list of IPs or CIDRs
# (or one comma-separated string). List ONLY your ingress controller's pod or
# node addresses, and when you list a pod CIDR, restrict
# networkPolicy.ingressFrom to the ingress controller, or any pod in that range
# can choose its client IP. 0.0.0.0/0, ::/0 and any other /0 are refused at
# render time; knot refuses to start, with an error naming
# KNOT_TRUSTED_PROXIES, on a malformed entry or one with host bits after the
# prefix (10.0.0.5/8: write 10.0.0.0/8, or the bare address). Empty: the TCP
# peer is the client; behind a proxy that sends X-Forwarded-For the per-IP
# limits (sign-in, public share links) are then skipped rather than shared by
# every client, counted in
# knot_client_ip_unresolved_total{reason="no_trusted_proxies"}. Behind an L4
# balancer that adds no X-Forwarded-For, every client shares one sign-in
# bucket: see the README, "Client IP behind a proxy".
trustedProxies: []

# Optional quotas, 0 = off. Pages count every page (archived ones and templates
# included) until it is purged; file bytes count uploaded attachments and
# copies, not board previews. Per user counts what that user created or
# uploaded. A workspace quota without a per-user one lets one account use it
# all. Checked before each create, upload, duplicate and import; best effort
# under concurrency (concurrent creates can overshoot by what runs at once).
# Each is at most 9007199254740991 (2^53 - 1, as Helm reads numbers as floats).
quotas:
  pagesPerUser: 0
  pagesPerWorkspace: 0
  blobBytesPerUser: 0
  blobBytesPerWorkspace: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

migrations:
  enabled: true
  backoffLimit: 3

probes:
  enabled: true

# Graceful shutdown. On SIGTERM the server stops accepting connections, sends
# a 1001 Close to live collab WebSockets, and drains in-flight HTTP. preStop
# sleeps first so the pod leaves Service endpoints before draining begins
# (kube-proxy stops routing new traffic). Uses the native `sleep` lifecycle
# handler — no shell, so it works on the scratch image. After the HTTP drain
# each page's writer gets up to 10 s to save the edits it still holds (during
# a database outage it keeps retrying them).
# Budget: preStop (preStopSleepSeconds) + up to 30 s of HTTP drain + up to
# 10 s of page-writer drain + 5 s of slack = 50 s. A shorter grace period can
# lose buffered edits on a shutdown during a database outage.
terminationGracePeriodSeconds: 50
preStopSleepSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
